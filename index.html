<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spin the Wheel</title>
<meta name="description" content="Enter names, spin the wheel, pick a random winner.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1020;
    --bg2: #1b1d3a;
    --panel: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.12);
    --text: #f4f4ff;
    --muted: #a6a8d0;
    --accent: #ffcc33;
    --accent2: #ff4f8b;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Fredoka", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 10% -10%, #3a2a7a 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 110%, #7a2a5a 0%, transparent 60%),
      var(--bg);
    display: flex;
    flex-direction: column;
  }
  header { text-align: center; padding: 28px 16px 8px; }
  header h1 {
    margin: 0;
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 700;
    letter-spacing: .5px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  header p { margin: 6px 0 0; color: var(--muted); }
  .brand {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 8px 18px 8px 10px; margin-bottom: 14px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
  }
  .brand img { height: 52px; max-width: 180px; object-fit: contain; border-radius: 12px; background: #fff; padding: 2px 6px; }
  .brand img[hidden] { display: none; }
  .brand span { font-size: 1.15rem; font-weight: 600; letter-spacing: .5px; }
  .brand span:empty { display: none; }
  .card .brand-mini { height: 48px; max-width: 160px; object-fit: contain; margin-bottom: 12px; background: #fff; border-radius: 10px; padding: 2px 6px; }
  .card .brand-mini[hidden] { display: none; }

  main {
    flex: 1;
    width: 100%;
    max-width: 1150px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
    gap: 28px;
    align-items: start;
  }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }

  /* ---------- Wheel ---------- */
  .wheel-wrap {
    position: relative;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    aspect-ratio: 1;
  }
  #wheel {
    width: 100%; height: 100%;
    display: block;
    border-radius: 50%;
    box-shadow: 0 0 0 8px rgba(255,255,255,.08), 0 25px 60px rgba(0,0,0,.55);
  }
  .pointer {
    position: absolute;
    top: -14px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-top: 42px solid var(--accent);
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.5));
    z-index: 2;
    transform-origin: 50% 0;
  }
  .pointer.tick { animation: tick .12s ease-out; }
  @keyframes tick { 0%{transform:translateX(-50%) rotate(0)} 40%{transform:translateX(-50%) rotate(-14deg)} 100%{transform:translateX(-50%) rotate(0)} }

  .spin-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 22%; aspect-ratio: 1;
    border-radius: 50%;
    border: 5px solid #fff;
    background: radial-gradient(circle at 35% 30%, #fff3, transparent 60%), linear-gradient(135deg, var(--accent2), #b32d6b);
    color: #fff;
    font-family: inherit;
    font-weight: 700;
    font-size: clamp(1rem, 3vw, 1.5rem);
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,.45);
    transition: transform .15s ease, filter .15s ease;
    z-index: 3;
  }
  .spin-btn:hover:not(:disabled) { transform: translate(-50%, -50%) scale(1.06); filter: brightness(1.1); }
  .spin-btn:active:not(:disabled) { transform: translate(-50%, -50%) scale(.96); }
  .spin-btn:disabled { cursor: not-allowed; filter: grayscale(.6) brightness(.8); }

  .hint { text-align: center; color: var(--muted); margin-top: 18px; min-height: 1.4em; }

  /* ---------- Panel ---------- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    backdrop-filter: blur(8px);
  }
  .panel h2 { margin: 0 0 12px; font-size: 1.3rem; display: flex; justify-content: space-between; align-items: baseline; }
  .count { font-size: .95rem; color: var(--muted); font-weight: 400; }
  .count.full { color: var(--accent); }

  .add-row { display: flex; gap: 8px; }
  input[type=text], textarea {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: rgba(0,0,0,.25);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    outline: none;
  }
  input[type=text]:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 90px; margin-top: 10px; }

  button.btn {
    font: inherit;
    font-weight: 600;
    border: 0;
    border-radius: 12px;
    padding: 10px 14px;
    cursor: pointer;
    color: #1a1a2e;
    background: var(--accent);
    white-space: nowrap;
    transition: filter .15s;
  }
  button.btn:hover:not(:disabled) { filter: brightness(1.1); }
  button.btn:disabled { opacity: .45; cursor: not-allowed; }
  button.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button.btn.danger { background: transparent; color: var(--danger); border: 1px solid rgba(255,107,107,.4); }

  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: .95rem; }

  ul.names {
    list-style: none;
    margin: 14px 0;
    padding: 0;
    max-height: 320px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  ul.names li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 10px;
    background: rgba(0,0,0,.2);
    animation: pop .2s ease-out;
  }
  @keyframes pop { from { transform: scale(.9); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .swatch { width: 14px; height: 14px; border-radius: 4px; flex: none; }
  .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rm {
    border: 0; background: transparent; color: var(--muted);
    font-size: 1.2rem; line-height: 1; cursor: pointer; padding: 2px 6px; border-radius: 6px;
  }
  .rm:hover { color: var(--danger); background: rgba(255,107,107,.12); }
  .empty { color: var(--muted); text-align: center; padding: 18px 0; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .options { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; color: var(--muted); font-size: .95rem; }
  .options label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .options input { accent-color: var(--accent); width: 16px; height: 16px; }

  .history { margin-top: 18px; }
  .history ol { margin: 8px 0 0; padding-left: 22px; color: var(--muted); max-height: 140px; overflow-y: auto; }
  .history li span { color: var(--text); }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120px);
    background: #2a2c55; border: 1px solid var(--border); color: var(--text);
    padding: 10px 16px; border-radius: 12px; transition: transform .25s ease; z-index: 50;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ---------- Winner modal ---------- */
  .modal {
    position: fixed; inset: 0;
    display: none; align-items: center; justify-content: center;
    background: rgba(5,5,20,.7);
    backdrop-filter: blur(4px);
    z-index: 40;
    padding: 16px;
  }
  .modal.open { display: flex; }
  .card {
    background: linear-gradient(160deg, #2b2470, #4a1d4f);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px 28px;
    text-align: center;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
    animation: zoom .35s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes zoom { from { transform: scale(.6); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .card .label { color: var(--muted); letter-spacing: 3px; text-transform: uppercase; font-size: .85rem; }
  .card .winner {
    font-size: clamp(2rem, 8vw, 3rem);
    font-weight: 700;
    margin: 10px 0 24px;
    word-break: break-word;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .card .actions { justify-content: center; }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 45; }

  footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 0 16px 20px; }
</style>
</head>
<body>
  <header>
    <div class="brand" id="brand">
      <img id="brandLogo" alt="">
      <span id="brandName"></span>
    </div>
    <h1>Spin the Wheel</h1>
    <p>Add some names, give it a spin, and let fate decide.</p>
  </header>

  <main>
    <section>
      <div class="wheel-wrap">
        <div class="pointer" id="pointer"></div>
        <canvas id="wheel" width="1000" height="1000" aria-label="Name wheel"></canvas>
        <button class="spin-btn" id="spinBtn">SPIN</button>
      </div>
      <div class="hint" id="hint"></div>
    </section>

    <aside class="panel">
      <h2>Names <span class="count" id="count">0 / 50</span></h2>

      <form class="add-row" id="addForm" autocomplete="off">
        <input type="text" id="nameInput" placeholder="Type a name and press Enter" maxlength="40">
        <button class="btn" type="submit" id="addBtn">Add</button>
      </form>

      <details>
        <summary>Paste a list (one per line or comma separated)</summary>
        <textarea id="bulkInput" placeholder="Alice&#10;Bob&#10;Charlie"></textarea>
        <div class="actions" style="margin-top:8px">
          <button class="btn" id="bulkBtn" type="button">Add all</button>
        </div>
      </details>

      <ul class="names" id="nameList"></ul>

      <div class="actions">
        <button class="btn ghost" id="shuffleBtn" type="button">🔀 Shuffle</button>
        <button class="btn ghost" id="sampleBtn" type="button">✨ Sample names</button>
        <button class="btn danger" id="clearBtn" type="button">Clear all</button>
      </div>

      <div class="options">
        <label><input type="checkbox" id="optRemove"> Remove the winner from the wheel after each pick</label>
        <label><input type="checkbox" id="optSound" checked> Sound effects</label>
      </div>

      <div class="history">
        <h2 style="font-size:1.05rem">Recent winners</h2>
        <ol id="historyList"></ol>
      </div>
    </aside>
  </main>

  <footer>Picks use your browser's cryptographic random generator, so every name gets a fair shot.</footer>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="winnerName">
    <div class="card">
      <img class="brand-mini" id="cardLogo" alt="">
      <div class="label">🎉 The winner is 🎉</div>
      <div class="winner" id="winnerName"></div>
      <div class="actions">
        <button class="btn" id="spinAgainBtn" type="button">Spin again</button>
        <button class="btn ghost" id="removeWinnerBtn" type="button">Remove &amp; close</button>
        <button class="btn ghost" id="closeBtn" type="button">Close</button>
      </div>
    </div>
  </div>

  <canvas id="confetti"></canvas>
  <div class="toast" id="toast"></div>

<script>
(() => {
  // ====== Branding ======
  // Put your logo file next to index.html (PNG, SVG or JPG) and set its file name here.
  // Leave LOGO as "" to show no logo, or COMPANY_NAME as "" to show no name.
  const COMPANY_NAME = "Dominion Leasing Software";
  const LOGO = "logo.svg";

  // ====== Settings ======
  const MAX_NAMES = 50;          // change this to allow more/fewer names
  const SPIN_MS = 5500;          // spin duration
  const STORAGE_KEY = "spin-wheel-v1";

  const COLORS = ["#ff4f8b","#ffcc33","#36d1a5","#4f8bff","#a66bff","#ff8a3d","#2ec4e6","#e94bd8","#8bd44a","#ff6b6b","#5b6cff","#ffd166"];

  // ====== State ======
  let names = [];
  let history = [];
  let rotation = 0;              // radians
  let spinning = false;
  let lastWinnerIndex = -1;

  // ====== Elements ======
  const $ = id => document.getElementById(id);
  const canvas = $("wheel"), ctx = canvas.getContext("2d");
  const spinBtn = $("spinBtn"), hint = $("hint"), pointer = $("pointer");
  const nameInput = $("nameInput"), addForm = $("addForm"), addBtn = $("addBtn");
  const bulkInput = $("bulkInput"), bulkBtn = $("bulkBtn");
  const listEl = $("nameList"), countEl = $("count"), historyEl = $("historyList");
  const optRemove = $("optRemove"), optSound = $("optSound");
  const modal = $("modal"), winnerNameEl = $("winnerName");

  // ====== Persistence ======
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        names, history, remove: optRemove.checked, sound: optSound.checked
      }));
    } catch {}
  }
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      if (!d) return;
      names = Array.isArray(d.names) ? d.names.slice(0, MAX_NAMES) : [];
      history = Array.isArray(d.history) ? d.history.slice(0, 20) : [];
      optRemove.checked = !!d.remove;
      optSound.checked = d.sound !== false;
    } catch {}
  }

  // ====== Helpers ======
  function randInt(max) {               // unbiased crypto random int in [0, max)
    const buf = new Uint32Array(1);
    const limit = Math.floor(0x100000000 / max) * max;
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    return buf[0] % max;
  }
  function colorFor(i, n) {
    // avoid identical neighbours when wrapping around
    let c = COLORS[i % COLORS.length];
    if (n > 1 && i === n - 1 && c === COLORS[0]) c = COLORS[(i + 1) % COLORS.length];
    return c;
  }
  let toastTimer;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }

  // ====== Names ======
  function addNames(list) {
    let added = 0, dupes = 0, overflow = 0;
    for (let raw of list) {
      const n = raw.trim().slice(0, 40);
      if (!n) continue;
      if (names.length >= MAX_NAMES) { overflow++; continue; }
      if (names.some(x => x.toLowerCase() === n.toLowerCase())) { dupes++; continue; }
      names.push(n); added++;
    }
    if (overflow) toast(`Wheel is full — max ${MAX_NAMES} names`);
    else if (dupes && !added) toast("That name is already on the wheel");
    else if (dupes) toast(`Added ${added}, skipped ${dupes} duplicate${dupes > 1 ? "s" : ""}`);
    refresh();
    return added;
  }
  function removeAt(i) { names.splice(i, 1); refresh(); }

  function refresh() {
    // list
    listEl.innerHTML = "";
    if (!names.length) {
      listEl.innerHTML = '<li class="empty" style="background:none">No names yet — add a few!</li>';
    }
    names.forEach((n, i) => {
      const li = document.createElement("li");
      const sw = document.createElement("span");
      sw.className = "swatch"; sw.style.background = colorFor(i, names.length);
      const nm = document.createElement("span");
      nm.className = "nm"; nm.textContent = n; nm.title = n;
      const rm = document.createElement("button");
      rm.className = "rm"; rm.type = "button"; rm.textContent = "×";
      rm.setAttribute("aria-label", `Remove ${n}`);
      rm.disabled = spinning;
      rm.onclick = () => removeAt(i);
      li.append(sw, nm, rm);
      listEl.appendChild(li);
    });

    // counter & controls
    countEl.textContent = `${names.length} / ${MAX_NAMES}`;
    countEl.classList.toggle("full", names.length >= MAX_NAMES);
    const full = names.length >= MAX_NAMES;
    nameInput.disabled = full || spinning;
    addBtn.disabled = full || spinning;
    bulkBtn.disabled = full || spinning;
    nameInput.placeholder = full ? "Wheel is full" : "Type a name and press Enter";
    spinBtn.disabled = spinning || names.length < 2;
    $("shuffleBtn").disabled = spinning || names.length < 2;
    $("clearBtn").disabled = spinning || !names.length;
    $("sampleBtn").disabled = spinning;
    hint.textContent = spinning ? "Spinning…" :
      names.length < 2 ? "Add at least 2 names to spin." : "Click SPIN or press Space.";

    // history
    historyEl.innerHTML = history.length ? "" : '<li style="list-style:none;margin-left:-22px">No spins yet.</li>';
    history.forEach(h => {
      const li = document.createElement("li");
      const s = document.createElement("span"); s.textContent = h;
      li.appendChild(s);
      historyEl.appendChild(li);
    });

    drawWheel();
    save();
  }

  // ====== Drawing ======
  function drawWheel(highlight = -1) {
    const W = canvas.width, R = W / 2, cx = R, cy = R;
    ctx.clearRect(0, 0, W, W);

    if (!names.length) {
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
      g.addColorStop(0, "#2b2d55"); g.addColorStop(1, "#1a1b38");
      ctx.fillStyle = g; ctx.fill();
      ctx.fillStyle = "#a6a8d0"; ctx.font = "600 44px Fredoka, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("Add names to fill the wheel", cx, cy + 210);
      return;
    }

    const n = names.length, seg = (Math.PI * 2) / n;
    const fontSize = Math.max(18, Math.min(56, 520 / Math.sqrt(n) / 1.6));

    for (let i = 0; i < n; i++) {
      const a0 = rotation + i * seg, a1 = a0 + seg;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, R, a0, a1);
      ctx.closePath();
      ctx.fillStyle = colorFor(i, n);
      ctx.fill();
      if (i === highlight) { ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fill(); }
      ctx.strokeStyle = "rgba(255,255,255,.55)";
      ctx.lineWidth = n > 30 ? 1.5 : 3;
      ctx.stroke();

      // label
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(a0 + seg / 2);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.font = `600 ${fontSize}px Fredoka, sans-serif`;
      ctx.fillStyle = "#1a1a2e";
      const maxW = R * 0.66;
      let label = names[i];
      while (ctx.measureText(label).width > maxW && label.length > 1) label = label.slice(0, -1);
      if (label !== names[i]) label = label.slice(0, -1) + "…";
      ctx.fillText(label, R - 28, 0);
      ctx.restore();
    }

    // rim dots
    ctx.save();
    for (let i = 0; i < 36; i++) {
      const a = (i / 36) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * (R - 8), cy + Math.sin(a) * (R - 8), 5, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,.75)";
      ctx.fill();
    }
    ctx.restore();
  }

  // ====== Sound ======
  let audio;
  function tickSound() {
    if (!optSound.checked) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "triangle"; o.frequency.value = 900 + Math.random() * 200;
      g.gain.setValueAtTime(0.08, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.05);
      o.connect(g).connect(audio.destination);
      o.start(); o.stop(audio.currentTime + 0.06);
    } catch {}
  }
  function winSound() {
    if (!optSound.checked) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      [523.25, 659.25, 783.99, 1046.5].forEach((f, k) => {
        const o = audio.createOscillator(), g = audio.createGain();
        const t = audio.currentTime + k * 0.11;
        o.type = "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.15, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
        o.connect(g).connect(audio.destination);
        o.start(t); o.stop(t + 0.4);
      });
    } catch {}
  }

  // ====== Spin ======
  const POINTER_ANGLE = -Math.PI / 2; // top of the wheel
  const TAU = Math.PI * 2;
  const easeOut = t => 1 - Math.pow(1 - t, 4);

  function segmentAtPointer(rot) {
    const n = names.length, seg = TAU / n;
    const rel = ((POINTER_ANGLE - rot) % TAU + TAU) % TAU;
    return Math.floor(rel / seg) % n;
  }

  function spin() {
    if (spinning || names.length < 2) return;
    closeModal();
    spinning = true;
    refresh();

    const n = names.length, seg = TAU / n;
    const winner = randInt(n);
    const jitter = (Math.random() - 0.5) * seg * 0.8;     // land somewhere inside the slice
    const target = POINTER_ANGLE - (winner + 0.5) * seg + jitter;
    const start = rotation;
    let delta = ((target - start) % TAU + TAU) % TAU;
    delta += TAU * (6 + randInt(3));                       // 6–8 full turns
    const end = start + delta;

    const t0 = performance.now();
    let lastSeg = segmentAtPointer(start);

    function frame(now) {
      const p = Math.min(1, (now - t0) / SPIN_MS);
      rotation = start + delta * easeOut(p);
      const s = segmentAtPointer(rotation);
      if (s !== lastSeg) {
        lastSeg = s;
        tickSound();
        pointer.classList.remove("tick"); void pointer.offsetWidth; pointer.classList.add("tick");
      }
      drawWheel();
      if (p < 1) requestAnimationFrame(frame);
      else {
        rotation = end % TAU;
        finish(segmentAtPointer(rotation));
      }
    }
    requestAnimationFrame(frame);
  }

  function finish(idx) {
    spinning = false;
    lastWinnerIndex = idx;
    const name = names[idx];
    history.unshift(name);
    history = history.slice(0, 20);
    drawWheel(idx);
    winSound();
    confetti();
    winnerNameEl.textContent = name;
    modal.classList.add("open");
    $("spinAgainBtn").focus();
    refresh();
    drawWheel(idx);
  }

  function closeModal(removeWinner) {
    if (!modal.classList.contains("open")) return;
    modal.classList.remove("open");
    if ((removeWinner || optRemove.checked) && lastWinnerIndex >= 0 && lastWinnerIndex < names.length) {
      names.splice(lastWinnerIndex, 1);
    }
    lastWinnerIndex = -1;
    refresh();
  }

  // ====== Confetti ======
  const cf = $("confetti"), cctx = cf.getContext("2d");
  let pieces = [], cfRunning = false;
  function confetti() {
    cf.width = innerWidth; cf.height = innerHeight;
    for (let i = 0; i < 180; i++) {
      pieces.push({
        x: innerWidth / 2 + (Math.random() - 0.5) * 200,
        y: innerHeight / 2.5,
        vx: (Math.random() - 0.5) * 16,
        vy: Math.random() * -16 - 4,
        r: Math.random() * TAU,
        vr: (Math.random() - 0.5) * 0.4,
        w: 6 + Math.random() * 8, h: 8 + Math.random() * 10,
        c: COLORS[randInt(COLORS.length)],
        life: 0
      });
    }
    if (!cfRunning) { cfRunning = true; requestAnimationFrame(cfFrame); }
  }
  function cfFrame() {
    cctx.clearRect(0, 0, cf.width, cf.height);
    pieces.forEach(p => {
      p.vy += 0.45; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      cctx.save(); cctx.translate(p.x, p.y); cctx.rotate(p.r);
      cctx.fillStyle = p.c; cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      cctx.restore();
    });
    pieces = pieces.filter(p => p.y < cf.height + 40 && p.life < 400);
    if (pieces.length) requestAnimationFrame(cfFrame);
    else { cfRunning = false; cctx.clearRect(0, 0, cf.width, cf.height); }
  }

  // ====== Events ======
  addForm.addEventListener("submit", e => {
    e.preventDefault();
    if (addNames([nameInput.value])) nameInput.value = "";
    nameInput.focus();
  });
  bulkBtn.addEventListener("click", () => {
    const added = addNames(bulkInput.value.split(/[\n,]+/));
    if (added) { bulkInput.value = ""; toast(`Added ${added} name${added > 1 ? "s" : ""}`); }
  });
  $("shuffleBtn").addEventListener("click", () => {
    for (let i = names.length - 1; i > 0; i--) {
      const j = randInt(i + 1); [names[i], names[j]] = [names[j], names[i]];
    }
    refresh();
  });
  $("sampleBtn").addEventListener("click", () => {
    addNames(["Ava","Liam","Mia","Noah","Zoe","Ethan","Luna","Leo"]);
  });
  $("clearBtn").addEventListener("click", () => {
    if (confirm("Remove all names from the wheel?")) { names = []; history = []; refresh(); }
  });
  optRemove.addEventListener("change", save);
  optSound.addEventListener("change", save);

  spinBtn.addEventListener("click", spin);
  $("spinAgainBtn").addEventListener("click", () => { closeModal(); spin(); });
  $("removeWinnerBtn").addEventListener("click", () => closeModal(true));
  $("closeBtn").addEventListener("click", () => closeModal());
  modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
    const typing = ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName);
    if (e.code === "Space" && !typing && !modal.classList.contains("open")) { e.preventDefault(); spin(); }
  });

  // ====== Branding setup ======
  function applyBranding() {
    $("brandName").textContent = COMPANY_NAME;
    if (COMPANY_NAME) document.title = `${COMPANY_NAME} · Spin the Wheel`;
    const logos = [$("brandLogo"), $("cardLogo")];
    if (!LOGO) { logos.forEach(i => i.hidden = true); }
    else {
      logos.forEach(img => {
        img.alt = COMPANY_NAME ? `${COMPANY_NAME} logo` : "Logo";
        img.onerror = () => { img.hidden = true; };   // missing file → just hide it
        img.src = LOGO;
      });
      const probe = new Image();
      probe.onload = () => { document.querySelector("link[rel=icon]").href = LOGO; };
      probe.src = LOGO;
    }
    if (!COMPANY_NAME && !LOGO) $("brand").hidden = true;
  }

  // ====== Init ======
  applyBranding();
  load();
  refresh();
  if (document.fonts) document.fonts.ready.then(() => drawWheel());
})();
</script>
</body>
</html>
